<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Linktree</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3ff;color:#0f1340;font:15px/1.4 system-ui,sans-serif;padding-bottom:90px}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;margin:8px 0 16px}h2{font-size:17px;margin:0 0 6px}
.box{background:#fff;border:2px solid #0f1340;border-radius:16px;padding:14px;margin-bottom:16px;box-shadow:0 4px 0 #0f1340}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 3px}
input{width:100%;padding:10px;border:1.5px solid #c9ccf0;border-radius:10px;font:inherit;background:#fbfbff}
input:focus{outline:2px solid #2a3cff;border-color:#2a3cff}
.row{display:flex;gap:10px}.row>*{flex:1}
button{font:inherit;font-weight:700;padding:10px 14px;border:2px solid #0f1340;border-radius:10px;background:#2a3cff;color:#fff;cursor:pointer}
button.g{background:#fff;color:#0f1340}
.it{border:1.5px dashed #b7bbe8;border-radius:12px;padding:10px;margin:10px 0}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd button{padding:4px 10px}
small{display:block;color:#5b5f8f;margin-top:6px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #0f1340;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center}
#st{font-size:13px}#st.er{color:#c0152f;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Admin Linktree</h1>
  <section class="box">
    <h2>Koneksi GitHub</h2>
    <label>Repo (user/nama-repo)<input id="repo" placeholder="austin/linktree"></label>
    <div class="row"><label>Branch<input id="br" value="main"></label><label>File data<input id="fp" value="data.json"></label></div>
    <label>Token GitHub<input id="tk" type="password" placeholder="github_pat_..." autocomplete="off"></label>
    <small>Pakai fine-grained token: hanya repo ini, izin Contents: Read and write. Token tersimpan di browser ini saja.</small>
    <div class="row" style="margin-top:12px"><button id="load">Muat data</button><button class="g" id="out">Hapus token</button></div>
  </section>
  <section id="ed" hidden>
    <div class="box"><h2>Profil</h2><div id="top"></div></div>
    <div class="box"><h2>Tombol link</h2><small>Ikon: nama kelas Font Awesome, contoh fa-solid fa-music</small><div id="ln"></div><button class="g" data-a="add" data-l="links">+ Tambah tombol</button></div>
    <div class="box"><h2>Ikon sosial media</h2><div id="sc"></div><button class="g" data-a="add" data-l="socials">+ Tambah sosmed</button></div>
  </section>
</main>
<div id="bar"><button id="save">Simpan ke GitHub</button><span id="st"></span></div>
<script>
const $=s=>document.querySelector(s),L=localStorage,ids=['repo','br','fp','tk'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const enc=t=>btoa(unescape(encodeURIComponent(t)));
let D;
const say=(m,e)=>{$('#st').textContent=m;$('#st').className=e?'er':''};
ids.forEach(k=>{if(L['lt_'+k])$('#'+k).value=L['lt_'+k]});
const cfg=()=>{ids.forEach(k=>L['lt_'+k]=$('#'+k).value.trim());return{r:$('#repo').value.trim(),b:$('#br').value.trim()||'main',p:$('#fp').value.trim()||'data.json',t:$('#tk').value.trim()}};
async function api(path,o={}){
  const c=cfg(),put=o.method==='PUT';
  const r=await fetch(`https://api.github.com/repos/${c.r}/contents/${path}`+(put?'':`?ref=${c.b}`),{...o,headers:{Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
  if(!r.ok)throw new Error(r.status===401?'Token salah atau kedaluwarsa':r.status===403?'Token tidak punya izin Contents: Read and write':r.status===404?'Repo atau file tidak ditemukan':r.status===409?'Konflik versi, coba lagi':'GitHub error '+r.status);
  return r.json();
}
const inp=(k,lab,v)=>`<label>${lab}<input data-k="${k}" value="${esc(v)}"></label>`;
const btns=(l,i)=>`<span><button class="g" data-a="up" data-l="${l}" data-i="${i}">↑</button> <button class="g" data-a="dn" data-l="${l}" data-i="${i}">↓</button> <button class="g" data-a="rm" data-l="${l}" data-i="${i}">Hapus</button></span>`;
function render(){
  $('#top').innerHTML=inp('name','Nama',D.name)+inp('tagline','Tagline',D.tagline)+inp('avatar','Foto / logo (URL atau path)',D.avatar)+'<label>Unggah foto baru<input type="file" id="up" accept="image/*"></label>';
  $('#ln').innerHTML=D.links.map((l,i)=>`<div class="it"><div class="hd"><b>Tombol ${i+1}</b>${btns('links',i)}</div>${inp(`links.${i}.title`,'Judul',l.title)}${inp(`links.${i}.desc`,'Deskripsi',l.desc)}${inp(`links.${i}.url`,'Link',l.url)}${inp(`links.${i}.icon`,'Ikon',l.icon)}</div>`).join('');
  $('#sc').innerHTML=D.socials.map((s,i)=>`<div class="it"><div class="hd"><b>${esc(s.label)||'Sosmed '+(i+1)}</b>${btns('socials',i)}</div>${inp(`socials.${i}.label`,'Nama',s.label)}${inp(`socials.${i}.url`,'Link',s.url)}${inp(`socials.${i}.icon`,'Ikon',s.icon)}</div>`).join('');
}
document.oninput=e=>{const k=e.target.dataset.k;if(!k)return;const a=k.split('.');let o=D;a.slice(0,-1).forEach(x=>o=o[x]);o[a.at(-1)]=e.target.value};
document.onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,l=D[b.dataset.l],i=+b.dataset.i;
  if(a==='rm'){if(!confirm('Hapus item ini?'))return;l.splice(i,1)}
  else if(a==='up'&&i>0)[l[i-1],l[i]]=[l[i],l[i-1]];
  else if(a==='dn'&&i<l.length-1)[l[i+1],l[i]]=[l[i],l[i+1]];
  else if(a==='add')l.push(b.dataset.l==='links'?{title:'',desc:'',url:'',icon:'fa-solid fa-link'}:{label:'',icon:'fa-brands fa-',url:''});
  render();
};
document.onchange=async e=>{
  const f=e.target.id==='up'&&e.target.files[0];if(!f)return;
  try{
    say('Mengunggah foto...');
    const path='assets/avatar.'+(f.name.split('.').pop()||'png').toLowerCase();
    const b64=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
    let sha;try{sha=(await api(path)).sha}catch{}
    await api(path,{method:'PUT',body:JSON.stringify({message:'Update foto profil',content:b64,branch:cfg().b,sha})});
    D.avatar=path+'?v='+Date.now();render();say('Foto terunggah. Klik Simpan untuk menerapkan.');
  }catch(x){say(x.message,1)}
};
$('#load').onclick=async()=>{
  try{say('Memuat...');const j=await api(cfg().p);D=JSON.parse(dec(j.content));render();$('#ed').hidden=false;say('Data termuat')}
  catch(e){say(e.message,1)}
};
$('#save').onclick=async()=>{
  if(!D)return say('Muat data dulu',1);
  try{
    say('Menyimpan...');const c=cfg(),cur=await api(c.p);
    await api(c.p,{method:'PUT',body:JSON.stringify({message:'Update linktree via admin',content:enc(JSON.stringify(D,null,2)+'\n'),sha:cur.sha,branch:c.b})});
    say('Tersimpan. Situs update setelah deploy selesai.');
  }catch(e){say(e.message,1)}
};
$('#out').onclick=()=>{L.removeItem('lt_tk');$('#tk').value='';say('Token dihapus dari browser ini')};
</script>
</body>
</html>
